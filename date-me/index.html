<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Date Me</title>
  <link rel="stylesheet" href="../style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />
</head>
<body class="date-me">
  <main class="date-me-shell">
    <section class="date-card" aria-labelledby="date-title">
      <a class="date-back" href="/" aria-label="Back home">
        <i class="fa-solid fa-arrow-left" aria-hidden="true"></i>
      </a>

      <h1 id="date-title">Date Me</h1>
      <p class="date-copy">Enter your Twitch username to check current availability.</p>

      <form id="twitch-form" class="twitch-form">
        <label for="twitch-username">Twitch username</label>
        <div class="username-field">
          <span aria-hidden="true">@</span>
          <input
            id="twitch-username"
            name="username"
            type="text"
            inputmode="text"
            autocomplete="username"
            required
          />
        </div>
        <button class="date-submit" type="submit">
          <i class="fa-regular fa-calendar-check" aria-hidden="true"></i>
          Check availability
        </button>
      </form>
    </section>
  </main>

  <div id="booking-modal" class="booking-modal" hidden role="dialog" aria-modal="true" aria-labelledby="booking-title">
    <div class="booking-panel">
      <button id="booking-close" class="booking-close" type="button" aria-label="Close booking modal">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>

      <div class="booking-header">
        <div>
          <h2 id="booking-title">Book a date with zacker150</h2>
          <p id="booking-for" class="booking-for"></p>
        </div>
      </div>

      <div class="calendar-toolbar">
        <button id="prev-month" type="button" aria-label="Previous month">
          <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        </button>
        <strong id="calendar-month"></strong>
        <button id="next-month" type="button" aria-label="Next month">
          <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        </button>
      </div>

      <div class="calendar-grid" aria-label="Calendar. Every date is unavailable.">
        <span class="weekday">Sun</span>
        <span class="weekday">Mon</span>
        <span class="weekday">Tue</span>
        <span class="weekday">Wed</span>
        <span class="weekday">Thu</span>
        <span class="weekday">Fri</span>
        <span class="weekday">Sat</span>
      </div>

      <div class="waitlist-row">
        <p>All dates are currently unavailable. Please check back later for openings.</p>
        <button id="waitlist-button" type="button">
          Join waitlist
        </button>
      </div>
    </div>
  </div>

  <div id="waitlist-modal" class="waitlist-modal" hidden role="dialog" aria-modal="true" aria-labelledby="waitlist-title">
    <div class="waitlist-panel">
      <button id="waitlist-close" class="waitlist-close" type="button" aria-label="Close message">
        <i class="fa-solid fa-xmark" aria-hidden="true"></i>
      </button>
      <h2 id="waitlist-title">You do realize this is a Twitter joke, right?</h2>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
